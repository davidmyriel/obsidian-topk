name: Nightly

on:
    schedule:
        - cron: '17 5 * * *'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    live:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24.x
                  cache: npm
            - run: npm ci
            - name: Live TopK tests
              env:
                  TOPK_API_KEY: ${{ secrets.TOPK_API_KEY }}
              run: npx vitest run --project live --silent=false

    e2e:
        strategy:
            fail-fast: false
            matrix:
                os: [macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24.x
                  cache: npm
            - run: npm ci
            - uses: actions/cache@v4
              with:
                  path: .obsidian-cache
                  key: obsidian-${{ runner.os }}-${{ hashFiles('wdio.conf.mts', 'manifest.json') }}
            - run: npm run test:e2e
